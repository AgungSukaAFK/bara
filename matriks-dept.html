<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriks POV Dept - Smart BARA 7.10 HZ</title>
    <link rel="stylesheet" href="css/app.css?v=20261102-smooth-loading">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#090d16] text-slate-100 flex h-screen overflow-hidden">

    <aside id="appSidebar" class="w-64 glass-panel border-r border-white/10 flex flex-col z-40 fixed inset-y-0 left-0 transition-transform duration-200 lg:static lg:translate-x-0 -translate-x-full">
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <header id="appHeader" class="glass-panel border-b border-white/10 px-6 py-3.5 flex items-center justify-between z-20">
        </header>

        <main class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Header Banner -->
            <div class="glass-panel rounded-2xl p-6 border border-white/10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-gradient-to-r from-slate-900 via-slate-900/90 to-teal-950/40 shadow-xl">
                <div>
                    <span class="badge badge-teal mb-2">Matriks Konsolidasi Departemen</span>
                    <h2 class="text-2xl font-black text-white m-0 tracking-tight">Matriks POV Antar Departemen</h2>
                    <p class="text-xs text-slate-400 mt-1 m-0">Tabel cross-tabulation alokasi beban per akun terhadap masing-masing departemen.</p>
                </div>
                <div class="flex items-center gap-2">
                    <span id="laporanStatusText" class="text-xs text-slate-400 font-semibold"></span>
                </div>
            </div>

            <!-- Table Container -->
            <div class="glass-panel rounded-xl border border-white/10 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto max-h-[72vh]">
                    <table class="app-table">
                        <thead id="matriksTableHead">
                        </thead>
                        <tbody id="matriksTableBody" class="divide-y divide-white/5">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/config.js?v=20261105-goa"></script>
    <script src="js/utils/formatters.js?v=upload-safety-1"></script>
    <script src="js/core.js?v=20261106-safe-cloud-write"></script>
    <script src="js/modules/upload.js?v=20261106-budget-template-upload"></script>
    <script src="js/layout.js?v=20261102-upload-preview-wide"></script>
    <script src="js/modules/laporan.js?v=20261102-matrix-reconcile-values"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.SmartBaraCore.init();
            await window.SmartBaraLayout.init('matriks-dept');
            await window.LaporanModule.init('matriks');
        });
    </script>
</body>
</html>
